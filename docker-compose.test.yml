name: sigab-broker-test

services:
  mosquitto:
    # Build en vez de "image:" directo: necesita el entrypoint que genera
    # docker/passwd al arrancar (ver Dockerfile.mosquitto). El digest de
    # eclipse-mosquitto:2 base sigue fijado ahí mismo.
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME requerido para TEST}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD requerido para TEST}
    # MQTT no es HTTP: Traefik/el dominio de Dokploy no lo enruta, así que
    # este es el único servicio del broker que necesita puerto de host
    # publicado explícitamente (pedir que lo habiliten en el firewall).
    # Puertos por defecto DISTINTOS a dev (1884/9001) para no colisionar en
    # el mismo servidor compartido. Verificado en vivo vía docker.getContainers
    # de Dokploy (2026-09-09), no solo por el comentario de docker-compose.yml:
    # 1883 lo tiene publicado el contenedor "emqx" de otro proyecto (running),
    # 1884/9001 los tiene publicados "sigab-brokerdev-jwjecq-mosquitto-1"
    # (running) — ninguno de los dos queda disponible para test. 1885/9002
    # confirmados libres en esa misma revisión.
    #
    # OJO: la variable se llama MQTT_HOST_PORT, no MQTT_PORT — ver la nota
    # completa en docker-compose.yml (mismo riesgo de conexión rota entre
    # gateway y mosquitto si se usa el nombre equivocado).
    ports:
      - "${MQTT_HOST_PORT:-1885}:1883"
      - "${MQTT_WS_HOST_PORT:-9002}:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_secrets:/mosquitto/secrets
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      # Fijo, no viene de Dokploy: puerto INTERNO de mosquitto (nunca
      # cambia), distinto de MQTT_HOST_PORT (el publicado al host).
      MQTT_PORT: 1883
    # No se publica puerto de host: se enruta por dominio vía Traefik en
    # Dokploy (configurar el dominio apuntando al puerto interno 8000).
    expose:
      - "8000"
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_secrets:
