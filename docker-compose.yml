services:
  mosquitto:
    # Build en vez de "image:" directo: necesita el entrypoint que prepara
    # dynamic-security.json al arrancar (ver Dockerfile.mosquitto). El digest
    # de eclipse-mosquitto:2 base sigue fijado ahí mismo.
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    environment:
      # Admin de dynamic-security = el gateway. Las credenciales de los
      # dispositivos y los topics de cada rol los crea el gateway por $CONTROL;
      # este contenedor solo rota, con el broker apagado, la clave del gateway y
      # la de la credencial compartida legacy (mientras exista).
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:-}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-}
      # TC-M09-253: qué puerto del contenedor se publica al host (ver "ports").
      # El entrypoint los usa para abortar el arranque si se pide TLS sin certs.
      MQTT_PUERTO_PUBLICO: ${MQTT_PUERTO_PUBLICO:-1883}
      MQTT_WS_PUERTO_PUBLICO: ${MQTT_WS_PUERTO_PUBLICO:-9001}
    # MQTT no es HTTP: Traefik/el dominio de Dokploy no lo enruta, así que
    # este es el único servicio del broker que necesita puerto de host
    # publicado explícitamente (pedir que lo habiliten en el firewall,
    # igual que el 5447 del backend). Default 1884 (no 1883): en el
    # servidor Dokploy compartido el 1883 ya lo ocupa el contenedor EMQX
    # de otro proyecto (host-wide, confirmado por inspección directa del
    # contenedor) — colisión real, no hipotética.
    #
    # OJO: la variable se llama MQTT_HOST_PORT, no MQTT_PORT — el gateway
    # (app/config.py) también lee una env var MQTT_PORT, pero para el
    # puerto INTERNO de conexión (mosquitto:1883, no cambia nunca). Si acá
    # se usa el mismo nombre, Dokploy inyecta el valor del puerto de host
    # (ej. 5449) también dentro del contenedor del gateway, que entonces
    # intenta conectar a mosquitto:5449 (nada escucha ahí) en vez de
    # mosquitto:1883 → "Connection refused" permanente. Ya pasó una vez.
    #
    # TC-M09-253 (TLS obligatorio en el canal expuesto): el segundo número de
    # cada mapeo es el puerto del CONTENEDOR que se publica. Por defecto es el de
    # texto plano (1883/9001: dev, sin certificados). En test/prod definir
    #   MQTT_PUERTO_PUBLICO=8883  MQTT_WS_PUERTO_PUBLICO=9002
    # (con certs en docker/certs, ver docker/certs/README.md): el host publica
    # solo los listeners TLS, y el texto plano queda únicamente dentro de la red
    # de Docker, donde lo usa el gateway. Los puertos de host no cambian
    # (MQTT_HOST_PORT / MQTT_WS_HOST_PORT), así que no hay que tocar el firewall.
    ports:
      - "${MQTT_HOST_PORT:-1884}:${MQTT_PUERTO_PUBLICO:-1883}"
      - "${MQTT_WS_HOST_PORT:-9001}:${MQTT_WS_PUERTO_PUBLICO:-9001}"
      # SEG-BROKER-02: puertos TLS (mqtts/wss). Descomentar o definir únicamente
      # en ambientes donde se monten certificados en ./docker/certs y se asigne
      # un puerto de host no colisionante en Dokploy. No publicar por defecto
      # en dev/test porque 8883 ya está ocupado en el host por EMQX y 9002 por test.
      # - "${MQTT_TLS_HOST_PORT:-8883}:8883"
      # - "${MQTT_WSS_HOST_PORT:-9002}:9002"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Certs TLS (fullchain.pem/privkey.pem, convención Let's
      # Encrypt/certbot) — gitignoreados, los provee Ops por ambiente. Ver
      # docker/certs/README.md.
      - ./docker/certs:/mosquitto/certs:ro
      # Volumen nombrado con dynamic-security.json (SEG-BROKER-03): usuarios,
      # roles y hashes de contraseña de todas las credenciales MQTT. Persiste
      # entre reinicios/redeploys. Perderlo obliga a regenerar e instalar la
      # credencial de cada Raspberry: respaldarlo (Volume Backups de Dokploy).
      # Ojo: recrear el compose en Dokploy cambia el appName y con él el nombre
      # del volumen, que arranca vacío.
      - mosquitto_secrets:/mosquitto/secrets
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
      # Fijo, no viene de Dokploy: es el puerto INTERNO de mosquitto (nunca
      # cambia), distinto de MQTT_HOST_PORT (el publicado al host). Ver
      # nota en el servicio "mosquitto" de arriba — evita que un
      # MQTT_PORT mal seteado en el panel de Dokploy rompa la conexión
      # interna otra vez.
      MQTT_PORT: 1883
    # No se publica puerto de host: se enruta por dominio vía Traefik en
    # Dokploy (configurar el dominio apuntando al puerto interno 8000).
    expose:
      - "8000"
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_secrets:
