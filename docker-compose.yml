services:
  mosquitto:
    # Build en vez de "image:" directo: necesita el entrypoint que genera
    # docker/passwd al arrancar (ver Dockerfile.mosquitto). El digest de
    # eclipse-mosquitto:2 base sigue fijado ahí mismo.
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # MQTT no es HTTP: Traefik/el dominio de Dokploy no lo enruta, así que
    # este es el único servicio del broker que necesita puerto de host
    # publicado explícitamente (pedir que lo habiliten en el firewall,
    # igual que el 5447 del backend). Default 1884 (no 1883): en el
    # servidor Dokploy compartido el 1883 ya lo ocupa el contenedor EMQX
    # de otro proyecto (host-wide, confirmado por inspección directa del
    # contenedor) — colisión real, no hipotética.
    ports:
      - "${MQTT_PORT:-1884}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Volumen nombrado en un directorio aparte (no /mosquitto/config,
      # que ya tiene el bind mount de arriba): ./docker/passwd está
      # gitignoreado y no existe en un clone nuevo, así que el entrypoint
      # lo genera dentro de este volumen en el primer arranque y persiste
      # entre reinicios/redeploys. mosquitto.conf apunta su password_file
      # acá (ver docker/mosquitto.conf).
      - mosquitto_secrets:/mosquitto/secrets
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MQTT_HOST: mosquitto
    # No se publica puerto de host: se enruta por dominio vía Traefik en
    # Dokploy (configurar el dominio apuntando al puerto interno 8000).
    expose:
      - "8000"
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_secrets:
