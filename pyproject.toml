[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgpmp"
version = "0.1.0"
description = "SGPMP - MQTT <-> HTTPS gateway para la plataforma AIoT de monitoreo de salud animal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiomqtt>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # BRK-02: cliente HTTP hacia sgpmp-backend (ya estaba en requirements.lock).
    "httpx>=0.27",
]

[project.optional-dependencies]
# RF-66: solo la imagen del motor de inferencia (motor_ia/) los instala, con las versiones
# fijadas de los entregables de ET-02 v5. El broker no los necesita.
# numpy==2.5.3 exige Python 3.12 o superior: la imagen del motor usa 3.13 y el broker sigue en 3.11.
motor-ia = [
    "onnxruntime==1.29.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
]
# AJF-14 (RF-71): el reentrenador del motor. Versiones fijadas de ET-02 v5
# (requirements_ET02_v5.txt); solo la imagen que reentrena las instala, encima de [motor-ia].
motor-ia-entrenamiento = [
    "onnxruntime==1.29.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "xgboost==3.4.1",
    "scikit-learn==1.9.1",
    "imbalanced-learn==0.14.2",
    "onnx==1.23.2",
    "onnxmltools==1.16.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "motor_ia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
