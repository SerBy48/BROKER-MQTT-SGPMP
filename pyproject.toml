[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sgpmp"
version = "0.1.0"
description = "SGPMP - MQTT <-> HTTPS gateway para la plataforma AIoT de monitoreo de salud animal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiomqtt>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # BRK-02: cliente HTTP hacia sgpmp-backend (ya estaba en requirements.lock).
    "httpx>=0.27",
]

[project.optional-dependencies]
# RF-66: solo la imagen del motor de inferencia (motor_ia/) los instala, con las versiones
# fijadas de los entregables de ET-02 v5. El broker no los necesita.
motor-ia = [
    "onnxruntime==1.29.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "motor_ia"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
