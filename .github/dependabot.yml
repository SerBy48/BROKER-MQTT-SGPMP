# Dependabot: PRs semanales de actualizacion de dependencias.
# Recomendacion 3 de INFORME-CALIBRACION-SAST-SCA-CI-M03-M04 (Taiga #5045, hallazgo I-5).
# Los PRs llegan a la rama de integracion (develop) y pasan por la revision normal del equipo.
# Nota: Dependabot solo lee este archivo desde la rama por defecto del repo,
# asi que empieza a funcionar cuando el cambio llegue a esa rama.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      menores-y-parches:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
