listener 1883
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# SEG-BROKER-02: listeners TLS (8883/mqtts y 9002/wss) generados por
# mosquitto-entrypoint.sh en /mosquitto/config/conf.d/tls.conf, solo si hay
# certificados montados en /mosquitto/certs. Si no hay certs (dev sin TLS
# configurado todavía), este directorio queda vacío y el broker sirve
# solo texto plano arriba — no es un error de arranque.
include_dir /mosquitto/config/conf.d
