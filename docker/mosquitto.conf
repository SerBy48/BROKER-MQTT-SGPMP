# SEG-BROKER-03 (TC-M09-250/251): autenticación y ACL con el plugin
# dynamic-security. Una credencial por Gateway Edge (usuario = su serial) con el
# rol de cada serial que atiende (modulo9.dispositivos_iot.id_dispositivo_gateway):
# no puede leer ni escribir los topics de otros, y un SUBSCRIBE '#' recibe un
# SUBACK de fallo.
# Con per_listener_settings en su default (false) el plugin aplica a todos los
# listeners, incluidos los TLS que genera el entrypoint.
#
# El archivo vive en el volumen mosquitto_secrets: lo crea el entrypoint en el
# primer arranque (con MQTT_USERNAME como admin, que es el gateway) y después
# lo modifica el broker en caliente cuando el gateway da de alta, rota o revoca
# credenciales por $CONTROL/dynamic-security/v1. No editar a mano ni versionar.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/secrets/dynamic-security.json

listener 1883
allow_anonymous false

listener 9001
protocol websockets
allow_anonymous false

# SEG-BROKER-02: listeners TLS (8883/mqtts y 9002/wss) generados por
# mosquitto-entrypoint.sh en /mosquitto/config/conf.d/tls.conf, solo si hay
# certificados montados en /mosquitto/certs. Si no hay certs (dev sin TLS
# configurado todavía), este directorio queda vacío y el broker sirve
# solo texto plano arriba — no es un error de arranque.
include_dir /mosquitto/config/conf.d
